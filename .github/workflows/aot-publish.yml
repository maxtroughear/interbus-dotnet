name: Native AOT Publish and Run

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/InterBus/**'
      - 'src/InterBus.InMemory/**'
      - 'samples/Sample.InMemory.Aot/**'
      - '.github/workflows/aot-publish.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/InterBus/**'
      - 'src/InterBus.InMemory/**'
      - 'samples/Sample.InMemory.Aot/**'
      - '.github/workflows/aot-publish.yml'

jobs:
  aot-publish:
    name: Native AOT Publish and Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT prerequisites
        run: sudo apt-get install -y clang zlib1g-dev

      - name: Publish (Native AOT, linux-x64)
        # Publishes the dedicated AOT sample which uses a source-generated JsonSerializerContext
        # and manually registers consumers (no netstandard2.0 SourceGenerator dependency).
        # A successful publish with zero warnings proves InterBus and the InMemory transport
        # are fully AOT-compatible when configured correctly.
        run: >
          dotnet publish samples/Sample.InMemory.Aot/Sample.InMemory.Aot.csproj
          --runtime linux-x64
          --configuration Release

      - name: Run native binary
        # Run the published binary end-to-end to confirm message routing works at native speed.
        run: samples/Sample.InMemory.Aot/bin/Release/net10.0/linux-x64/publish/Sample.InMemory.Aot

name: Build and Test (Core)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/InterBus/**'
      - 'src/InterBus.InMemory/**'
      - 'src/InterBus.SourceGenerator/**'
      - 'tests/InterBus.Tests/**'
      - 'tests/InterBus.InMemory.Tests/**'
      - 'tests/InterBus.SourceGenerator.Tests/**'
      - 'tests/InterBus.EntityFrameworkCore.Tests/**'
      - 'tests/InterBus.TickerQ.Tests/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/InterBus/**'
      - 'src/InterBus.InMemory/**'
      - 'src/InterBus.SourceGenerator/**'
      - 'tests/InterBus.Tests/**'
      - 'tests/InterBus.InMemory.Tests/**'
      - 'tests/InterBus.SourceGenerator.Tests/**'
      - 'tests/InterBus.EntityFrameworkCore.Tests/**'
      - 'tests/InterBus.TickerQ.Tests/**'
      - '.github/workflows/build.yml'

jobs:
  build-and-test:
    name: Build and Test (Core)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: |
          dotnet test tests/InterBus.Tests/InterBus.Tests.csproj \
            --no-build --configuration Release --verbosity normal
          dotnet test tests/InterBus.InMemory.Tests/InterBus.InMemory.Tests.csproj \
            --no-build --configuration Release --verbosity normal
          dotnet test tests/InterBus.SourceGenerator.Tests/InterBus.SourceGenerator.Tests.csproj \
            --no-build --configuration Release --verbosity normal
          dotnet test tests/InterBus.EntityFrameworkCore.Tests/InterBus.EntityFrameworkCore.Tests.csproj \
            --no-build --configuration Release --verbosity normal
          dotnet test tests/InterBus.TickerQ.Tests/InterBus.TickerQ.Tests.csproj \
            --no-build --configuration Release --verbosity normal

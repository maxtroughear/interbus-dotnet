name: CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'samples/**'
      - '.github/workflows/build.yml'

jobs:
  build-and-test:
    name: Build and Test (Core)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: |
          dotnet test tests/InterBus.Tests/InterBus.Tests.csproj \
            --no-build --configuration Release --verbosity normal
          dotnet test tests/InterBus.SourceGenerator.Tests/InterBus.SourceGenerator.Tests.csproj \
            --no-build --configuration Release --verbosity normal
          dotnet test tests/InterBus.EntityFrameworkCore.Tests/InterBus.EntityFrameworkCore.Tests.csproj \
            --no-build --configuration Release --verbosity normal
          dotnet test tests/InterBus.TickerQ.Tests/InterBus.TickerQ.Tests.csproj \
            --no-build --configuration Release --verbosity normal
          dotnet test tests/InterBus.Hangfire.Tests/InterBus.Hangfire.Tests.csproj \
            --no-build --configuration Release --verbosity normal

  test-dynamodb-localstack:
    name: Test - DynamoDB (LocalStack)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test tests/InterBus.DynamoDB.Tests/InterBus.DynamoDB.Tests.csproj
          --no-build --configuration Release --verbosity normal
          
  test-dynamodb-aws:
    name: Test - DynamoDB (AWS)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@6.2.2
        with:
          role-to-assume: arn:aws:iam::404304993722:role/InterBus-GitHub-Actions
          aws-region: us-east-1

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test tests/InterBus.DynamoDB.Tests/InterBus.DynamoDB.Tests.csproj
          --no-build --configuration Release --verbosity normal
        env:
          INTERBUS_USE_REAL_AWS: 'true'

  test-sqs-localstack:
    name: Test - SQS (LocalStack)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test tests/InterBus.AmazonSqs.Tests/InterBus.AmazonSqs.Tests.csproj
          --no-build --configuration Release --verbosity normal

  test-sqs-aws:
    name: Test - SQS (AWS)
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@6.2.2
        with:
          role-to-assume: arn:aws:iam::404304993722:role/InterBus-GitHub-Actions
          aws-region: us-east-1

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test tests/InterBus.AmazonSqs.Tests/InterBus.AmazonSqs.Tests.csproj
          --no-build --configuration Release --verbosity normal
        env:
          INTERBUS_USE_REAL_AWS: 'true'
          INTERBUS_EVENTBRIDGE_TARGET_ROLE_ARN: 'arn:aws:iam::404304993722:role/InterBusSchedulerRole'

  test-rabbitmq:
    name: Test - RabbitMQ
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test tests/InterBus.RabbitMQ.Tests/InterBus.RabbitMQ.Tests.csproj
          --no-build --configuration Release --verbosity normal

  test-postgresql:
    name: Test - PostgreSQL
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test tests/InterBus.PostgreSQL.Tests/InterBus.PostgreSQL.Tests.csproj
          --no-build --configuration Release --verbosity normal

  test-efcore-postgresql:
    name: Test - EntityFrameworkCore (PostgreSQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test tests/InterBus.EntityFrameworkCore.PostgreSQL.IntegrationTests/InterBus.EntityFrameworkCore.PostgreSQL.IntegrationTests.csproj
          --no-build --configuration Release --verbosity normal

  test-efcore-sqlserver:
    name: Test - EntityFrameworkCore (SQL Server)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test tests/InterBus.EntityFrameworkCore.SqlServer.IntegrationTests/InterBus.EntityFrameworkCore.SqlServer.IntegrationTests.csproj
          --no-build --configuration Release --verbosity normal
          
  test-azure-service-bus:
    name: Test - Azure Service Bus
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test tests/InterBus.AzureServiceBus.Tests/InterBus.AzureServiceBus.Tests.csproj
          --no-build --configuration Release --verbosity normal

  aot-publish:
    name: Native AOT Publish and Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT prerequisites
        run: sudo apt-get install -y clang zlib1g-dev

      - name: Publish (Native AOT, linux-x64)
        run: >
          dotnet publish samples/Sample.InMemory.Aot/Sample.InMemory.Aot.csproj
          --runtime linux-x64
          --configuration Release

      - name: Run native binary
        run: samples/Sample.InMemory.Aot/bin/Release/net10.0/linux-x64/publish/Sample.InMemory.Aot

  sample-postgresql:
    name: Sample - PostgreSQL (Postgres 18)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interbus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT prerequisites
        run: sudo apt-get install -y clang zlib1g-dev

      - name: Publish Sample.PostgreSQL (Native AOT, linux-x64)
        run: >
          dotnet publish samples/Sample.PostgreSQL/Sample.PostgreSQL.csproj
          --runtime linux-x64
          --configuration Release

      - name: Run Sample.PostgreSQL
        run: samples/Sample.PostgreSQL/bin/Release/net10.0/linux-x64/publish/Sample.PostgreSQL
        env:
          CONNECTIONSTRINGS__INTERBUS: "Host=localhost;Port=5432;Database=interbus;Username=postgres;Password=postgres"

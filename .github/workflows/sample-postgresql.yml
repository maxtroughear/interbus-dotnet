name: Sample – PostgreSQL (Postgres 18)

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/InterBus/**'
      - 'src/InterBus.PostgreSQL/**'
      - 'samples/Sample.PostgreSQL/**'
      - '.github/workflows/sample-postgresql.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/InterBus/**'
      - 'src/InterBus.PostgreSQL/**'
      - 'samples/Sample.PostgreSQL/**'
      - '.github/workflows/sample-postgresql.yml'

jobs:
  sample-postgresql:
    name: Sample – PostgreSQL (Postgres 18)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interbus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT prerequisites
        run: sudo apt-get install -y clang zlib1g-dev

      - name: Publish Sample.PostgreSQL (Native AOT, linux-x64)
        run: >
          dotnet publish samples/Sample.PostgreSQL/Sample.PostgreSQL.csproj
          --runtime linux-x64
          --configuration Release

      - name: Run Sample.PostgreSQL
        run: samples/Sample.PostgreSQL/bin/Release/net10.0/linux-x64/publish/Sample.PostgreSQL
        env:
          CONNECTIONSTRINGS__INTERBUS: "Host=localhost;Port=5432;Database=interbus;Username=postgres;Password=postgres"

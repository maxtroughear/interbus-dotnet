name: Test – PostgreSQL Transport

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/InterBus/**'
      - 'src/InterBus.PostgreSQL/**'
      - 'tests/InterBus.PostgreSQL.Tests/**'
      - '.github/workflows/test-postgresql.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/InterBus/**'
      - 'src/InterBus.PostgreSQL/**'
      - 'tests/InterBus.PostgreSQL.Tests/**'
      - '.github/workflows/test-postgresql.yml'

jobs:
  test-postgresql:
    name: Test – PostgreSQL Transport
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test tests/InterBus.PostgreSQL.Tests/InterBus.PostgreSQL.Tests.csproj
          --no-build --configuration Release --verbosity normal
